include: package:dart_frog_lint/recommended.yaml

linter:
  rules:
    # Project conventions: this is an application, not a published package.
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    always_use_package_imports: false
    cascade_invocations: false
    prefer_constructors_over_static_methods: false
    # Noisy in tests: map lookups and fixtures legitimately cross types.
    cast_nullable_to_non_nullable: false
    avoid_dynamic_calls: false
    avoid_redundant_argument_values: false
    directives_ordering: false
