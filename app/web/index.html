<!DOCTYPE html>
<html>
<head>

    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">

    name="description"
    content="Teamak Rider Ownership Programme — apply, track your application, and follow your journey from submission to rider ownership."

  <meta name="theme-color" content="#0D47A1">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Teamak Rider Ownership Programme">
  <meta
    property="og:description"
    content="Apply, track your application, and follow your journey from submission to rider ownership."
  >
  <meta
    property="og:url"
    content="https://thompsonmoses-web.github.io/teamak-portal/"
  >
  <meta
    property="og:image"
    content="https://thompsonmoses-web.github.io/teamak-portal/icons/Icon-512.png"
  >
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Teamak Rider Ownership Programme">
  <meta
    name="twitter:description"
    content="Apply, track your application, and follow your journey from submission to rider ownership."
  >
  <meta
    name="twitter:image"
    content="https://thompsonmoses-web.github.io/teamak-portal/icons/Icon-512.png"
  >

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Teamak">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Teamak Rider Ownership</title>
  <link rel="manifest" href="manifest.json">
